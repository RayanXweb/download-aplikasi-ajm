<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Background animation */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, #00f2ff22, transparent 60%);
    animation: moveBg 10s linear infinite;
}

@keyframes moveBg {
    from { transform: translate(-20%, -20%); }
    to { transform: translate(0%, 0%); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 420px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(25px);
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    text-align: center;
    z-index: 2;
}

.lock {
    font-size: 55px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1);}
    50% { transform: scale(1.15);}
    100% { transform: scale(1);}
}

h1 {
    margin: 10px 0;
    color: #ff4d4d;
}

.status {
    font-size: 13px;
    opacity: 0.8;
    height: 20px;
}

.progress {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    margin: 20px 0;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#00f2ff,#4facfe);
    transition: width 0.3s;
}

.timer {
    font-size: 40px;
    margin: 10px 0;
    color: #00f2ff;
}

.btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    background: linear-gradient(90deg,#00f2ff,#4facfe);
    color: black;
    text-decoration: none;
    font-weight: bold;
    margin-top: 15px;
}

.hidden {
    display: none;
}

.glitch {
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    100% { transform: translate(1px, 1px); }
}
</style>
</head>

<body>

<div class="container" id="app">
    <div class="lock">🔒</div>
    <h1 id="title">Memverifikasi Akses</h1>
    <div class="status" id="status">Menghubungi server...</div>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="timer hidden" id="timer">01:00</div>

    <a href="#" class="btn hidden" id="btn">Upgrade Premium</a>
</div>

<script>
// ================= CONFIG =================
const redirectURL = "https://join-ajm-control-panel.vercel.app"; // GANTI URL TUJUAN
// ==========================================

// SOUND
function beep() {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
}

// REDIRECT FUNCTION (ANTI GAGAL)
function goRedirect() {
    window.location.href = redirectURL;

    // backup redirect
    setTimeout(() => {
        window.location.replace(redirectURL);
    }, 500);
}

// STEP SIMULATION
const steps = [
    "Menghubungi server...",
    "Memeriksa lisensi...",
    "Validasi perangkat...",
    "Sinkronisasi akun...",
    "Trial terdeteksi habis!"
];

let stepIndex = 0;
let progress = 0;

const statusEl = document.getElementById("status");
const bar = document.getElementById("bar");
const timerEl = document.getElementById("timer");
const btn = document.getElementById("btn");
const title = document.getElementById("title");

function runSteps() {
    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress % 20 === 0 && stepIndex < steps.length) {
            statusEl.textContent = steps[stepIndex];
            stepIndex++;
            beep();
        }

        if (progress >= 100) {
            clearInterval(interval);
            startCountdown();
        }
    }, 200);
}

// COUNTDOWN
let time = 60;

function startCountdown() {
    title.textContent = "Akses Ditolak";
    statusEl.textContent = "Silakan upgrade untuk melanjutkan";
    timerEl.classList.remove("hidden");
    btn.classList.remove("hidden");

    let countdown = setInterval(() => {
        let m = Math.floor(time / 60);
        let s = time % 60;

        timerEl.textContent =
            (m<10?"0":"")+m+":"+(s<10?"0":"")+s;

        if (time <= 10) {
            timerEl.style.color = "#ff4d4d";
            timerEl.classList.add("glitch");
            beep();
        }

        if (time <= 0) {
            clearInterval(countdown);

            document.getElementById("app").style.opacity = "0";

            setTimeout(() => {
                goRedirect(); // AUTO REDIRECT
            }, 1000);
        }

        time--;
    }, 1000);
}

// BUTTON REDIRECT
btn.onclick = function(e) {
    e.preventDefault();
    goRedirect();
};

// START
runSteps();
</script>

</body>
</html>
