<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJM Control Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#03000a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* ================= CENTER FIX ================= */
.wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    height:100%;
}

/* ================= CARD ================= */
.card{
    backdrop-filter: blur(25px);
    background:rgba(255,255,255,0.03);
    padding:40px;
    border-radius:30px;
    width:90%;
    max-width:400px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* ================= ICON ================= */
.icon{
    width:80px;
    height:80px;
    margin:0 auto 15px;
}

.icon img{
    width:100%;
    filter:drop-shadow(0 0 10px #00f2fe);
}

/* ================= TITLE ================= */
h1{
    font-family:'Poppins',sans-serif;
    font-size:26px;
    margin-bottom:10px;
}

/* ================= INPUT ================= */
.input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(0,0,0,0.3);
    color:white;
}

/* ================= BUTTON ================= */
.btn{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:50px;
    background:#00f2fe;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

/* ================= WA BUTTON ================= */
.btn-wa{
    margin-top:15px;
    padding:14px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(37,211,102,0.08);
    color:white;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    transition:0.3s;
}

.btn-wa:hover{
    background:rgba(37,211,102,0.2);
    color:#25D366;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="card">

<!-- ICON -->
<div class="icon">
<img src="https://image2url.com/r2/default/images/1775052662243-09801d3b-036c-465c-bf89-20603c5906b0.png">
</div>

<h1>AJM CONTROL PANEL</h1>
<p>Trial 3 Hari 🚀</p>

<input id="username" class="input" placeholder="Username">
<input id="password" type="password" class="input" placeholder="Password">

<button id="btnDaftar" class="btn">Daftar & Install</button>

<!-- WHATSAPP BUTTON -->
<a href="https://whatsapp.com/channel/0029VbC3fLR17En0IWiDqy3V" target="_blank" class="btn-wa">
📲 Tutorial Install via WhatsApp
</a>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
 apiKey: "AIzaSyBSRUZheiN6UQshTHyKvZN0PLZ-pYyF3JE",
 authDomain: "pengunjung-dbc40.firebaseapp.com",
 databaseURL: "https://pengunjung-dbc40-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId: "pengunjung-dbc40",
 storageBucket: "pengunjung-dbc40.firebasestorage.app",
 messagingSenderId: "176191314530",
 appId: "1:176191314530:web:c3421dfc8c1434aaba0f3b"
});

const auth = getAuth(app);

btnDaftar.onclick = async ()=>{
 let u = username.value;
 let p = password.value;

 if(!u || !p){
  alert("Isi semua data");
  return;
 }

 await createUserWithEmailAndPassword(auth, u+"@app.com", p);

 window.open("https://www.upload-apk.com/tL0XYxozh7zxt60");
};

</script>

</body>
</html>
